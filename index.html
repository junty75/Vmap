/* ─── Web Share Target: '공유 → 지도'로 받은 파일 소비 ─────
   sw.js 가 공유 POST 를 받아 'shared-files' 캐시에 넣고 './?shared=1' 로 리다이렉트한다.
   런처 htm 도 이 경로로 데이터를 넘긴다(안드로이드에서 앱이 링크를 가로채면 창끼리
   연결이 끊겨 postMessage 를 못 쓰기 때문). manifest 에 share_target 은 있었는데
   소비하는 쪽이 없어서 받은 파일이 그냥 버려지고 있었다. */
async function consumeSharedFiles() {
  if (!/[?&]shared=1/.test(location.search)) return;
  history.replaceState(history.state, '', location.pathname);   // 새로고침 시 재소비 방지
  try {
    const cache = await caches.open('shared-files');
    const mRes = await cache.match('./shared-manifest');
    if (!mRes) return;
    const names = await mRes.json();
    for (let i = 0; i < names.length; i++) {
      const r = await cache.match('./shared-file-' + i);
      if (!r) continue;
      const file = new File([await r.blob()], names[i]);
      if (/\.(jpe?g|png)$/i.test(names[i])) { await loadImage(file, () => null, () => {}); }
      else if (/\.html?$/i.test(names[i]))  { await loadHTM(file); autoSaveToDB(); }
      else { await loadKMZ(file); autoSaveToDB(); }
    }
    await caches.delete('shared-files');
  } catch (e) { console.warn('공유 파일 처리 실패', e); }
}

document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  e.target.value = '';
  refreshMapLayout();   // 선택창에서 돌아온 직후 컨테이너 크기 재계산
  const imgFiles = files.filter(f => /\.(jpe?g|png)$/i.test(f.name) || f.type.startsWith('image/'));
  const mapFiles = files.filter(f => /\.(kmz|zip|kml)$/i.test(f.name));
  const htmFiles = files.filter(_isHtmFile);
  for (const file of mapFiles) await loadKMZ(file);
  for (const file of htmFiles) await loadHTM(file);
  if (mapFiles.length > 0 || htmFiles.length > 0) autoSaveToDB();
  // 1장이어도 로딩 표시 — 처리 중 화면이 이유 없이 하얗게 보이던 문제 완화
  let noGPS = null, imgDone = 0;
  const photoPts = [];
  if (imgFiles.length > 0) showLoading('사진 불러오는 중... (0/' + imgFiles.length + ')');
  try {
    for (const file of imgFiles) {
      const c = await loadImage(file, () => noGPS, v => noGPS = v);
      if (c) photoPts.push(c);
      imgDone++;
      showLoading('사진 불러오는 중... (' + imgDone + '/' + imgFiles.length + ')');
      await new Promise(r => setTimeout(r, 30));   // 사진 사이 지도 렌더링 기회 부여
    }
  } finally {
    if (imgFiles.length > 0) hideLoading();
    refreshMapLayout();   // 처리 완료 후 한 번 더 — 타일 미로드 잔상 제거
  }
  if (photoPts.length > 0) { fitPts(photoPts); autoSaveToDB(); }
};



async function loadImage(file, getNG, setNG) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = async ev => {
      const src = ev.target.result, name = file.name.replace(/\.[^/.]+$/, '');
      // index.html 과 동일한 단순 경로: EXIF GPS 만 읽고 마커 추가.
      // 촬영 판정·현재위치 조회·EXIF 기록·기기 저장은 하지 않는다 (지도 백화 유발 이력).
      const meta = readPhotoMeta(src);
      // piexif 가 GPS 를 못 읽었으면 exifr 로 원본 파일을 다시 읽는다
      // (HEIC·삼성 MakerNote·XMP 위치 등 — readPhotoMetaFallback 주석 참조)
      let fb = null;
      if (meta.lat == null) {
        fb = await readPhotoMetaFallback(file);
        if (fb.lat != null) { meta.lat = fb.lat; meta.lng = fb.lng; }
        if (!meta.taken && fb.taken) meta.taken = fb.taken;
      }
      const ll = (meta.lat != null) ? [meta.lng, meta.lat] : null;

      // 대량 사진 대비 메모리 절약: 마커에는 압축 표시본만 사용.
      // 압축은 워커(OffscreenCanvas)에서 — 페이지 캔버스 압축은 지도 백화 유발.
      // 워커 미지원/실패 시 원본 그대로 사용 (백화 없던 옛 동작).
      let dispSrc = src;
      const compressed = await compressFileInWorker(file);
      if (compressed) {
        dispSrc = compressed;
        // GPS·촬영일시 EXIF 를 압축본에 복사 (KMZ 저장 시 위치·날짜 유지)
        try {
          const ex0 = piexif.load(src);
          if (ex0['0th']) {
            delete ex0['0th'][piexif.ImageIFD.UserComment];
            delete ex0['0th'][piexif.ImageIFD.ImageDescription];
            ex0['0th'][piexif.ImageIFD.Orientation] = 1;   // 워커 압축본은 픽셀에 회전 반영됨
          }
          if (ex0['Exif']) delete ex0['Exif'][piexif.ExifIFD.UserComment];
          dispSrc = _exifSafeCarry(ex0, compressed);
        } catch(e) {
          // piexif 로는 원본 EXIF 를 못 열었지만 exifr 이 위치를 찾은 경우 —
          // 압축본(JPEG)에 위치·촬영일시를 새로 써 넣어야 저장 파일에도 위치가 남는다
          dispSrc = (fb && fb.lat != null)
            ? writePhotoMeta(compressed, { lat: fb.lat, lng: fb.lng, taken: fb.taken || undefined })
            : compressed;
        }
      }

      const setMeta = obj => { obj.taken = meta.taken || ''; obj.desc = meta.desc || ''; };
      if (ll) {
        const c = toMerc(ll[0], ll[1]);
        setMeta(addPhotoMarker(c, dispSrc, name));
        document.getElementById('saveBtn').disabled = false;
        resolve(c);
      } else {
        if (getNG() === null) setNG(confirm(`"${file.name}" 위치 정보 없음.\n(갤러리 선택창은 안드로이드가 위치를 제거할 수 있음 — '파일' 앱으로 선택하면 유지)\n지도 중심에 추가할까요?`));
        if (getNG()) {
          setMeta(addPhotoMarker(vmap.getView().getCenter(), dispSrc, name));
          document.getElementById('saveBtn').disabled = false;
          // 지도 중심 추가도 fitPts 대상에 포함 — 위치 없는 사진만 불러온 경우에도
          // 강제 뷰포트 갱신이 일어나야 타일 백화가 복구됨
          resolve(vmap.getView().getCenter());
          return;
        }
        resolve(null);
      }
    };
    r.readAsDataURL(file);
  });
}

/* ════════════════════════════════
   KMZ 불러오기
════════════════════════════════ */
async function loadKMZ(file, silent = false) {
  if (silent) showLoading('이전 데이터 복원 중...');
  else showLoading('KMZ 불러오는 중...');

  if (silent) {
    closeAllPopups();
    markers.forEach(m => removeLyr(m.lyr)); markers = [];
    polylines.forEach(l => removeLyr(l)); polylines = [];
    clearTextLabelsV();
    document.getElementById('saveBtn').disabled = true;
  }

  try {
    // KMZ(zip)는 'PK'(0x50 0x4B)로 시작. 평문 .kml 은 zip 이 아니므로 헤더로 판별. (Vmap.html 이식)
    let zip = null, keys = [], kmlText = null;
    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    const isZip = head[0] === 0x50 && head[1] === 0x4B;
    if (isZip) {
      zip = await JSZip.loadAsync(file);
      keys = Object.keys(zip.files);
      for (const k of keys) {
        if (/\.kml$/i.test(k.replace(/\0/g, ''))) {
          try { const t = await zip.files[k].async('string'); if (t && t.length > 0) { kmlText = t; break; } } catch(e) {}
        }
      }
      if (!kmlText) { alert('KMZ 안에 .kml 파일이 없습니다.'); hideLoading(); return; }
    } else if (/\.kml$/i.test(file.name)) {
      kmlText = await file.text();   // 평문 KML (내부 임베드 사진 없음 — 마커/트랙만)
    } else {
      alert('KMZ / ZIP / KML 파일만 불러올 수 있습니다.'); hideLoading(); return;
    }

    showLoading('데이터 읽는 중...');
    const xml = new DOMParser().parseFromString(kmlText, 'application/xml');
    const pts = [];

    // KML 스타일 맵 (styleUrl -> 색·굵기). KML 색은 aabbggrr 순서. (Vmap.html 이식)
    const styleColors = {}, styleWidths = {};
    const kmlC2Hex = c => { c = (c||'').trim(); if (c.length < 8) return null; return '#' + c.slice(6,8) + c.slice(4,6) + c.slice(2,4); };
    for (const st of Array.from(xml.getElementsByTagName('Style'))) {
      const id = st.getAttribute('id'); if (!id) continue;
      const cs = (st.getElementsByTagName('LineStyle')[0] || st.getElementsByTagName('PolyStyle')[0]);
      const h = kmlC2Hex(cs?.getElementsByTagName('color')[0]?.textContent);
      if (h) styleColors['#'+id] = h;
      const w = parseFloat(cs?.getElementsByTagName('width')[0]?.textContent);
      if (!isNaN(w)) styleWidths['#'+id] = w;
    }
    const parseCoords = raw => raw.trim().split(/\s+/).map(c => {
      const p = c.split(','); const lo = parseFloat(p[0]), la = parseFloat(p[1]);
      return (!isNaN(lo)&&!isNaN(la)&&Math.abs(lo)<=180&&Math.abs(la)<=90) ? toMerc(lo,la) : null;
    }).filter(Boolean);

    for (const pm of Array.from(xml.getElementsByTagName('Placemark'))) {
      const name = pm.getElementsByTagName('name')[0]?.textContent?.trim() || pm.getElementsByTagName('n')[0]?.textContent?.trim() || '설명 없음';
      const pt = pm.getElementsByTagName('Point')[0];

      // ── CAD 문자(kind=text): 마커 대신 회전 텍스트 라벨만 ──
      if (pt) {
        let _kind = '';
        for (const d of Array.from(pm.getElementsByTagName('Data'))) {
          if (d.getAttribute('name') === 'kind') { _kind = (d.getElementsByTagName('value')[0]?.textContent || '').trim(); break; }
        }
        if (_kind === 'text') {
          const raw = pt.getElementsByTagName('coordinates')[0]?.textContent || '';
          const p = raw.trim().split(','); const lo = parseFloat(p[0]), la = parseFloat(p[1]);
          if (!isNaN(lo) && !isNaN(la) && Math.abs(lo) <= 180 && Math.abs(la) <= 90) {
            let _rot = 0, _col = '', _h = 0, _ax = 0, _ay = 0;
            for (const d of Array.from(pm.getElementsByTagName('Data'))) {
              const nm = d.getAttribute('name'); const v = d.getElementsByTagName('value')[0]?.textContent || '';
              if (nm === 'rot') _rot = parseFloat(v) || 0; else if (nm === 'color') _col = v.trim();
              else if (nm === 'h') _h = parseFloat(v) || 0;
              else if (nm === 'ax') _ax = parseFloat(v) || 0; else if (nm === 'ay') _ay = parseFloat(v) || 0;
            }
            const c = toMerc(lo, la); pts.push(c);
            addTextLabelV(c, name, _rot, _col, _h, _ax, _ay);
          }
          continue;
        }
      }

      // ── 선/폴리곤 도형 전부 수집 (MultiGeometry 안의 모든 LineString + Polygon 링) ──
      const coordArrays = [];
      for (const lsEl of Array.from(pm.getElementsByTagName('LineString'))) {
        const cs = parseCoords(lsEl.getElementsByTagName('coordinates')[0]?.textContent || '');
        if (cs.length >= 2) coordArrays.push(cs);
      }
      for (const pgEl of Array.from(pm.getElementsByTagName('Polygon'))) {
        for (const lr of Array.from(pgEl.getElementsByTagName('LinearRing'))) {
          const cs = parseCoords(lr.getElementsByTagName('coordinates')[0]?.textContent || '');
          if (cs.length >= 2) coordArrays.push(cs);
        }
      }

      if (coordArrays.length) {
        const su = pm.getElementsByTagName('styleUrl')[0]?.textContent?.trim();
        const color = (su && styleColors[su]) || randColor();
        const sw = (su && styleWidths[su] != null) ? Math.max(1, styleWidths[su]) : 4; // KMZ 굵기(없으면 4)
        // Placemark 하나(MultiGeometry 포함)의 모든 선을 레이어 1개에 — 수천 선 KMZ 경량화
        const lyr = mkMultiLineLyr(coordArrays, color, sw);
        lyr._name = name; addLyr(lyr); polylines.push(lyr);
        for (const cs of coordArrays) pts.push(...cs);
        continue;
      }

      // ── 점(사진/마커) ──
      if (pt) {
        let pf = '';
        for (const d of Array.from(pm.getElementsByTagName('Data'))) {
          if (d.getAttribute('name') === 'photoFile') { pf = d.getElementsByTagName('value')[0]?.textContent||''; break; }
        }
        if (!pf) {
          const desc = pm.getElementsByTagName('description')[0]?.textContent||'';
          const mImg = desc.match(/src=["']([^"']+\.(jpe?g|png))["']/i);
          if (mImg) {
            const thumbPath = mImg[1].trim(), rollPath = thumbPath.replace('_thumb.','_roll.');
            const rollEntry = keys.find(z => { const c = z.replace(/\0/g,''); return c===rollPath||c.endsWith('/'+rollPath.split('/').pop()); });
            pf = rollEntry ? rollPath : thumbPath;
          }
        }
        const raw = pt.getElementsByTagName('coordinates')[0]?.textContent||'';
        const p = raw.trim().split(','); const lo = parseFloat(p[0]), la = parseFloat(p[1]);
        if (isNaN(lo)||isNaN(la)||Math.abs(lo)>180||Math.abs(la)>90) continue;
        const c = toMerc(lo, la); pts.push(c);
        if (pf && zip) {
          const base = pf.split('/').pop(); let zipF = null;
          for (const k of keys) {
            const ck = k.replace(/\0/g,'');
            if (ck===pf||ck===`files/${pf}`||ck===`images/${base}`||ck.endsWith('/'+base)||ck===base) { zipF = zip.files[k]; break; }
          }
          if (zipF) {
            const b64 = await zipF.async('base64');
            const mime = base.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';
            const obj = addPhotoMarker(c, `data:${mime};base64,${b64}`, name);
            // 저장된 사진 메타(설명/촬영일시) 복원
            for (const d of Array.from(pm.getElementsByTagName('Data'))) {
              const nm = d.getAttribute('name'); const v = d.getElementsByTagName('value')[0]?.textContent || '';
              if (nm === 'desc') obj.desc = v; else if (nm === 'taken') obj.taken = v;
              else if (nm === 'orig') obj.origKey = v;   // 원본 보관소 키 (이 기기 DB에 있을 때만 유효)
            }
          } else addMarker(c, name);
        } else addMarker(c, name);
      }
    }
    fitPts(pts);
    if (pts.length > 0 || markers.length > 0 || polylines.length > 0)
      document.getElementById('saveBtn').disabled = false;
    hideLoading();
  } catch(err) { hideLoading(); alert('KMZ 오류: ' + err.message); }
}

/* ════════════════════════════════
   HTM 불러오기 (KMZ → HTM 변환 뷰어 파일)
   파일 안에 있는 var LINES / POLYS / TEXTS / MARKERS / PHOTOS 배열을 그대로 읽어 옴.
   좌표는 [lat, lng] 순서, 색은 #RRGGBB, 사진은 data:URL.
════════════════════════════════ */
function _htmArr(text, name) {
  // 각 배열은 한 줄에 하나씩 기록돼 있음 → 개행을 안 넘는 greedy 매칭이 안전
  const m = text.match(new RegExp('var\\s+' + name + '\\s*=\\s*(\\[.*\\])\\s*;'));
  if (!m) return [];
  try { return JSON.parse(m[1]); } catch(e) { return []; }
}
function _isHtmFile(f) { return /\.html?$/i.test(f.name); }

/* ── 중복 방지 ────────────────────────────────────────
   같은 파일을 여러 번 열어도 이미 지도에 있는 객체는 다시 만들지 않는다.
   지도에 살아있는 객체에서 매번 새로 뽑으므로, 지웠다가 다시 열면 되살아난다.

   점 객체(마커/사진/문자)는 좌표를 문자열로 굳혀 비교하면 안 된다 —
   35.6519945 처럼 반올림 경계에 걸린 값은 같은 지점인데도 "35.651994" / "35.651995"
   로 갈려 중복을 놓친다(실제로 사진 하나가 열 때마다 늘어났다).
   그래서 이름으로 묶어 두고 좌표는 오차 허용(약 0.2m)으로 비교한다.
   사진/일반마커는 같은 종류('M')로 취급 — KMZ 복원이 사진을 못 찾아 일반마커로
   떨어진 경우에도 중복이 생기지 않게. */
const _PT_EPS = 2e-6;
const _R6 = n => Number(n).toFixed(6);
function _sigLineLL(color, width, partsLL) {   // partsLL: [[[lat,lng],...],...]
  return 'L|' + color + '|' + width + '|' +
    partsLL.map(cs => cs.map(p => _R6(p[0]) + ',' + _R6(p[1])).join(';')).join('#');
}
function _ptKey(kind, name) { return kind + '|' + (name == null ? '' : name); }
function _hasPt(store, kind, lat, lng, name) {
  const a = store.pts.get(_ptKey(kind, name));
  if (!a) return false;
  for (const p of a) if (Math.abs(p[0] - lat) < _PT_EPS && Math.abs(p[1] - lng) < _PT_EPS) return true;
  return false;
}
function _addPt(store, kind, lat, lng, name) {
  const k = _ptKey(kind, name);
  const a = store.pts.get(k);
  if (a) a.push([lat, lng]); else store.pts.set(k, [[lat, lng]]);
}
function _existingSigs() {
  const store = { lines: new Set(), pts: new Map() };
  for (const lyr of polylines) {
    const partsLL = coordParts(lyr).map(cs => cs.map(c => { const ll = fromMerc(c); return [ll[1], ll[0]]; }));
    store.lines.add(_sigLineLL(lyr._color || '', lyr._width || 0, partsLL));
  }
  for (const m of markers) {
    const ll = fromMerc(m.feat.getGeometry().getCoordinates());
    _addPt(store, 'M', ll[1], ll[0], m.name);
  }
  for (const t of textLabelsV) {
    const ll = fromMerc(t.coord);
    _addPt(store, 'T', ll[1], ll[0], t.name);
  }
  return store;
}

async function loadHTM(file) {
  showLoading('HTM 읽는 중...');
  let D;
  try {
    const text = await file.text();
    D = { LINES:  _htmArr(text, 'LINES'),  POLYS:   _htmArr(text, 'POLYS'),
          TEXTS:  _htmArr(text, 'TEXTS'),  MARKERS: _htmArr(text, 'MARKERS'),
          PHOTOS: _htmArr(text, 'PHOTOS') };
  } catch (err) { hideLoading(); alert('HTM 오류: ' + err.message); return; }
  return _loadHtmData(D);
}

/* 위 배열들을 실제로 지도에 그린다.
   파일에서 읽은 경우(loadHTM)와 런처 htm 이 postMessage 로 보낸 경우(_installLinkReceiver)가 공유한다. */
async function _loadHtmData(D) {
  showLoading('HTM 읽는 중...');
  try {
    const LINES  = D.LINES  || [], POLYS   = D.POLYS   || [],
          TEXTS  = D.TEXTS  || [], MARKERS = D.MARKERS || [],
          PHOTOS = D.PHOTOS || [];
    if (!LINES.length && !POLYS.length && !TEXTS.length && !MARKERS.length && !PHOTOS.length) {
      hideLoading();
      alert('이 HTM 파일에서 지도 데이터를 찾지 못했습니다.\n(KMZ → HTM 로 변환된 지도 파일만 열 수 있습니다)');
      return;
    }

    const pts = [];
    const C = a => { const c = toMerc(a[1], a[0]); pts.push(c); return c; };   // [lat,lng] → 메르카토르
    // 같은 파일을 두 번 열어도 이미 있는 객체는 건너뛴다
    const sigs = _existingSigs();
    let skipped = 0;

    // 선 + 폴리곤(외곽선) — 원본 도면 순서(z)대로
    const shapes = LINES.concat(POLYS).sort((a, b) => (a.z || 0) - (b.z || 0));
    shapes.forEach(g => {
      const raw = (g.p || []).filter(part => part.length >= 2);
      const parts = raw.map(part => part.map(C));
      if (!parts.length) return;
      const color = /^#[0-9a-fA-F]{6}$/.test(g.c || '') ? g.c : randColor();
      const width = Math.max(1, Number(g.w) || 4);
      const sig = _sigLineLL(color, width, raw);
      if (sigs.lines.has(sig)) { skipped++; return; }
      sigs.lines.add(sig);
      const lyr = mkMultiLineLyr(parts, color, width);
      lyr._name = '선'; addLyr(lyr); polylines.push(lyr);
    });

    // CAD 문자 라벨 [lat,lng,내용,rot,color,h,ax,ay,tw]
    // (건너뛴 객체도 C() 로 좌표를 먼저 반영해 화면 맞춤 범위는 파일 전체 기준이 되게)
    TEXTS.forEach(t => {
      if (!t || t.length < 3) return;
      const c = C(t);
      const name = String(t[2] == null ? '' : t[2]);
      if (_hasPt(sigs, 'T', t[0], t[1], name)) { skipped++; return; }
      _addPt(sigs, 'T', t[0], t[1], name);
      addTextLabelV(c, t[2], t[3] || 0, t[4] || '', t[5] || 0, t[6] || 0, t[7] || 0);
    });

    // 일반 마커 [lat,lng,이름]
    MARKERS.forEach(m => {
      if (!m || m.length < 2) return;
      const c = C(m);
      const name = m[2] || '마커';
      if (_hasPt(sigs, 'M', m[0], m[1], name)) { skipped++; return; }
      _addPt(sigs, 'M', m[0], m[1], name);
      addMarker(c, name);
    });

    // 사진 마커 [lat,lng,이름,dataURL]
    for (let i = 0; i < PHOTOS.length; i++) {
      const ph = PHOTOS[i];
      if (!ph || ph.length < 4 || !ph[3]) continue;
      const c = C(ph);
      const name = ph[2] || '사진';
      if (_hasPt(sigs, 'M', ph[0], ph[1], name)) { skipped++; continue; }
      _addPt(sigs, 'M', ph[0], ph[1], name);
      addPhotoMarker(c, ph[3], name);
      if (i % 5 === 0) {
        showLoading('사진 불러오는 중... (' + (i + 1) + ' / ' + PHOTOS.length + ')');
        await new Promise(r => setTimeout(r, 0));
      }
    }

    fitPts(pts);
    if (skipped) showToastMsg('이미 있는 객체 ' + skipped + '개는 건너뛰었습니다');
    if (pts.length > 0 || markers.length > 0 || polylines.length > 0)
      document.getElementById('saveBtn').disabled = false;
    hideLoading();
  } catch(err) { hideLoading(); alert('HTM 오류: ' + err.message); }
}

   KMZ 저장
════════════════════════════════ */
// ─── 저장 범위 선택 (현재영역/전체영역) ───────────────
function askSaveScope() {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;display:flex;align-items:center;justify-content:center;';
    const btnCss = 'display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;';
    bg.innerHTML =
      '<div style="background:white;border-radius:14px;padding:20px;width:270px;box-shadow:0 4px 24px rgba(0,0,0,0.25);">' +
      '<h3 style="margin:0 0 14px;font-size:15px;color:#333;text-align:center;">저장 범위 선택</h3>' +
      `<button data-scope="view" style="${btnCss}background:#1a73e8;color:white;">📺 현재영역<br><span style="font-size:11px;font-weight:400;">화면에 보이는 객체만</span></button>` +
      `<button data-scope="all" style="${btnCss}background:#00897b;color:white;">🌍 전체영역<br><span style="font-size:11px;font-weight:400;">모든 객체</span></button>` +
      `<button data-scope="" style="${btnCss}background:#f1f3f4;color:#555;margin-bottom:0;">취소</button>` +
      '</div>';
    bg.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b && e.target !== bg) return;   // 박스 안 여백 클릭은 무시
      bg.remove();
      resolve(b ? (b.dataset.scope || null) : null);
    });
    document.body.appendChild(bg);
  });
}

document.getElementById('saveBtn').onclick = async () => {
  const scope = await askSaveScope();
  if (!scope) return;
  exportHTM(scope);
};

// 지도 위 객체 → 뷰어용 배열. 사진은 압축해 data URI 로 내장.
async function _collectHtmDataV(scope) {
  const extent = scope === 'view' ? vmap.getView().calculateExtent(vmap.getSize()) : null;
  const inView = c => !extent || ol.extent.containsCoordinate(extent, c);
  const R = n => +Number(n).toFixed(7);
  const D = { LINES: [], POLYS: [], TEXTS: [], MARKERS: [], PHOTOS: [] };

  for (const lyr of polylines) {
    const parts = coordParts(lyr);
    if (extent && !parts.some(cs => cs.some(inView))) continue;
    const p = parts.map(cs => cs.map(c => { const ll = fromMerc(c); return [R(ll[1]), R(ll[0])]; }))
                   .filter(cs => cs.length >= 2);
    if (p.length) D.LINES.push({ c: lyr._color || '#ff0000', o: 1, w: lyr._width || 3, p });
  }
  for (const t of textLabelsV) {
    if (!inView(t.coord)) continue;
    const ll = fromMerc(t.coord);
    D.TEXTS.push([R(ll[1]), R(ll[0]), t.name || '', t.rot || 0,
                  t.color || '#FFEB00', t.h || 0, t.ax || 0, t.ay || 0]);
  }
  const photoMarkers = [];
  for (const m of markers) {
    const c = m.feat.getGeometry().getCoordinates();
    if (!inView(c)) continue;
    const ll = fromMerc(c);
    if (m.isPhoto && m.imgSrc) photoMarkers.push([m, ll]);
    else D.MARKERS.push([R(ll[1]), R(ll[0]), m.name || '']);
  }
  for (let i = 0; i < photoMarkers.length; i++) {
    const [m, ll] = photoMarkers[i];
    showLoading('사진 압축 중... (' + (i + 1) + ' / ' + photoMarkers.length + ')');
    let src = '';
    try { src = await compressImage(m.imgSrc); } catch (e) { src = m.imgSrc; }
    D.PHOTOS.push([R(ll[1]), R(ll[0]), m.name || '', src]);
  }
  return D;
}

// 저장한 파일을 공유 시트로 보낸다 (공유앱 선택). 지원 안 하면 조용히 넘어감.
async function shareHtmFile(file, name) {
  if (!(navigator.canShare && navigator.share)) return;
  let shareable = false;
  try { shareable = navigator.canShare({ files: [file] }); } catch (e) { shareable = false; }
  if (!shareable) return;
  // 사진 압축·파일명 입력을 거치면서 '사용자 조작 유효시간'이 끝났을 수 있다 →
  // 바로 시도해 보고 막히면 버튼 한 번 더 누르게 한다.
  try {
    await navigator.share({ files: [file], title: name, text: name });
    return;
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // 사용자가 공유 취소
  }
  const bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9200;display:flex;align-items:center;justify-content:center;';
  bg.innerHTML =
    '<div style="background:white;border-radius:14px;padding:20px;width:270px;box-shadow:0 4px 24px rgba(0,0,0,0.25);text-align:center;">' +
    '<h3 style="margin:0 0 6px;font-size:15px;color:#333;">저장 완료</h3>' +
    '<p style="margin:0 0 14px;font-size:12px;color:#777;word-break:break-all;">' + esc(name) + '</p>' +
    '<button class="sh-go" style="display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;background:#1a73e8;color:white;">📤 공유하기</button>' +
    '<button class="sh-no" style="display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#f1f3f4;color:#555;">닫기</button>' +
    '</div>';
  bg.querySelector('.sh-no').onclick = () => bg.remove();
  bg.querySelector('.sh-go').onclick = async () => {
    bg.remove();
    try { await navigator.share({ files: [file], title: name, text: name }); } catch (e) {}
  };
  document.body.appendChild(bg);
}

async function exportHTM(scope = 'all') {
  // 저장 범위: 'view'=현재 화면에 보이는 객체만, 'all'=전체 객체
  if (!markers.length && !polylines.length && !textLabelsV.length) {
    alert('저장할 객체가 없습니다.');
    return;
  }
  const now = new Date();
  const dateStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const prefix = await getAddrPrefix();
  const last = ([...markers].reverse().find(m => !m.isPhoto) || markers.at(-1))?.name || '';
  const cleanLast = last.replace(/_\d{8}.*$/, '').replace(/[\\/:*?"<>|]/g, '').trim();
  const defaultName = cleanLast ? `${prefix}${dateStr}_${cleanLast}` : `${prefix}${dateStr}_지도`;

  const userInput = prompt('저장할 파일 이름을 입력하세요 (확장자 제외):', defaultName);
  if (userInput === null) return;
  const base = (userInput.trim() || defaultName).replace(/[\\/:*?"<>|]/g, '_');
  const fileName = base + '.htm';

  showLoading('HTM 저장 중...');
  try {
    const D = await _collectHtmDataV(scope);
    const n = D.LINES.length + D.POLYS.length + D.TEXTS.length + D.MARKERS.length + D.PHOTOS.length;
    if (!n) {
      hideLoading();
      alert(scope === 'view' ? '현재 화면에 보이는 객체가 없습니다.' : '저장할 객체가 없습니다.');
      return;
    }
    const html = buildLauncherHtm(base, D);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });

    // 1) 저장 (다운로드)
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    hideLoading();

    // 2) 공유 시트 (공유앱 선택)
    let f = null;
    try { f = new File([blob], fileName, { type: 'text/html' }); } catch (e) {}
    if (f) await shareHtmFile(f, fileName);
  } catch (err) {
    hideLoading();
    alert('HTM 저장 중 오류: ' + err.message);
  }
}

async function getAddrPrefix() {
  try {
    const center = vmap.getView().getCenter();
    const ll = fromMerc(center);
    const url = `https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0` +
      `&crs=epsg:4326&point=${ll[0]},${ll[1]}&type=parcel&format=json&key=${VWORLD_KEY}`;
    const d = await jsonp(url);
    if (d?.response?.status !== 'OK') return '';
    const text = d.response.result?.[0]?.text || '';
    const parts = text.split(' ').filter(p => !/^\d/.test(p));
    const eupMyeon = parts.find(p => /[읍면]$/.test(p))||'';
    const ri = parts.find(p => /리$/.test(p))||'';
    const gu = parts.find(p => /구$/.test(p))||'';
    const dong = [...parts].reverse().find(p => /동(\d+가)?$/.test(p))||'';
    if (eupMyeon && ri) return `${eupMyeon.replace(/[읍면]$/,'')}${ri}_`;
    if (eupMyeon) return `${eupMyeon}_`;
    if (gu && dong) return `${gu.replace(/구$/,'')}${dong}_`;
    if (gu) return `${gu.replace(/구$/,'')}_`;
    if (dong) return `${dong}_`;
    return '';
  } catch(e) { return ''; }
}

async function exportKMZ(scope = 'all') {
  // 저장 범위: 'view'=현재 화면에 보이는 객체만, 'all'=전체 객체
  const extent = scope === 'view' ? vmap.getView().calculateExtent(vmap.getSize()) : null;
  const inView = c => !extent || ol.extent.containsCoordinate(extent, c);
  const expMarkers = markers.filter(m => inView(m.feat.getGeometry().getCoordinates()));
  // 묶음선(멀티피처)은 어느 피처든 화면에 걸치면 포함 (coordParts — 첫 피처만 보면 유실)
  const expPolylines = polylines.filter(lyr => !extent || coordParts(lyr).some(cs => cs.some(inView)));
  const expLabels = textLabelsV.filter(t => inView(t.coord));
  if (expMarkers.length === 0 && expPolylines.length === 0 && expLabels.length === 0) {
    alert(scope === 'view' ? '현재 화면에 보이는 객체가 없습니다.' : '저장할 객체가 없습니다.');
    return;
  }

  const now = new Date();
  const dateStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const prefix = await getAddrPrefix();
  const last = ([...expMarkers].reverse().find(m => !m.isPhoto) || expMarkers.at(-1))?.name || '';
  const cleanLast = last.replace(/_\d{8}.*$/, '').replace(/[\\/:*?"<>|]/g, '').trim();
  const defaultName = cleanLast ? `${prefix}${dateStr}_${cleanLast}` : `${prefix}${dateStr}_`;

  const userInput = prompt('저장할 파일 이름을 입력하세요 (확장자 제외):', defaultName);
  if (userInput === null) return;
  const fileName = (userInput.trim() || defaultName) + '.kmz';

  showLoading('KMZ 저장 중...');
  try {
    const zip = new JSZip();
    const ff = zip.folder('files');
    let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(fileName)}</name>\n`;
    const usedFn = new Set();

    const styles = new Map();
    let lineKml = '';
    for (const lyr of expPolylines) lineKml += _lineKmlPlacemarkV(lyr, styles);
    for (const t of expLabels) lineKml += _textKmlPlacemarkV(t);
    kml += _lineKmlStyleDefsV(styles) + lineKml + '\n';
    for (const m of expMarkers) {
      const ll = fromMerc(m.feat.getGeometry().getCoordinates());
      const sn = esc(m.name);
      if (m.isPhoto && m.imgSrc) {
        const c = await compressImage(m.imgSrc);
        let base = (m.name||'photo').replace(/[\/\\:*?"<>|]/g,'_').replace(/\.jpg$/i,'');
        let fn = base + '.jpg'; let sx = 1;
        while (usedFn.has(fn)) { fn = `${base}_${sx++}.jpg`; }
        usedFn.add(fn);
        ff.file(fn, c.split(',')[1], { base64: true });
        kml += `<Placemark><name>${sn}</name><description><![CDATA[<img src="files/${fn}" style="max-width:400px">]]></description><ExtendedData><Data name="photoFile"><value>${fn}</value></Data>${_photoMetaXmlV(m)}</ExtendedData><Point><coordinates>${ll[0]},${ll[1]},0</coordinates></Point></Placemark>\n`;
      } else {
        kml += `<Placemark><name>${sn}</name><Point><coordinates>${ll[0]},${ll[1]},0</coordinates></Point></Placemark>\n`;
      }
    }
    kml += '</Document></kml>';
    zip.file('doc.kml', kml);

    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.google-earth.kmz' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    hideLoading();
  } catch(err) { hideLoading(); alert('KMZ 저장 중 오류: ' + err.message); }
}

/* ═══════════════════════════════════════════════════
   삭제 — 빗자루(전체) / 지우개(선택) / 되돌리기

   · 빗자루 🧹 : 확인 후 전부 삭제
   · 지우개    : 모드 토글. 지도를 누르면 그 지점 화면 ERASE_TOL_PX 픽셀 안의
                 객체를 한 번에 지운다 → 축소 상태에선 같은 반경이 넓은 지역을
                 덮으므로 근처 여러 개가 한꺼번에 지워진다.
   · 되돌리기  : 지운 '묶음'을 최근 것부터 하나씩 되살린다.
                 (한 번의 탭에서 지워진 여러 개 = 한 묶음)
                 지우개로 실제로 지웠을 때만 지우개 왼쪽에 나타나고,
                 지우개 모드를 끝내면 버튼도 이력도 사라진다.
                 → 빗자루(전체삭제)는 되돌리기 대상이 아니다.
═══════════════════════════════════════════════════ */
const ERASE_TOL_PX = 22;      // 지우개 반경(화면 픽셀)
const ERASE_HISTORY_MAX = 60; // 되돌리기 보관 묶음 수
let eraseMode = false;
let eraseHistory = [];        // [ [ {kind,obj}, ... ], ... ]  뒤쪽이 최신

function updateUndoBtn() {
  document.getElementById('undoBtn')
    .classList.toggle('show', eraseMode && eraseHistory.length > 0);
}
function pushEraseBatch(batch) {
  if (!batch.length) return;
  eraseHistory.push(batch);
  while (eraseHistory.length > ERASE_HISTORY_MAX) eraseHistory.shift();
  updateUndoBtn();
}
function _removeErasedV(it) {
  if (it.kind === 'marker') {
    if (it.obj.ov) { vmap.removeOverlay(it.obj.ov); it.obj.ov = null; }
    removeLyr(it.obj.lyr);
    markers = markers.filter(m => m !== it.obj);
  } else if (it.kind === 'line') {
    removeLyr(it.obj);
    polylines = polylines.filter(l => l !== it.obj);
  } else {
    try { textLabelLyr.getSource().removeFeature(it.obj.feat); } catch (e) {}
    textLabelsV = textLabelsV.filter(t => t !== it.obj);
  }
}
function _restoreErasedV(it) {
  if (it.kind === 'marker') { addLyr(it.obj.lyr); markers.push(it.obj); }
  else if (it.kind === 'line') { addLyr(it.obj); polylines.push(it.obj); }
  else {
    try { _ensureTextLabelLyr().getSource().addFeature(it.obj.feat); } catch (e) {}
    textLabelsV.push(it.obj);
  }
}
function _syncSaveBtnV() {
  document.getElementById('saveBtn').disabled =
    !(markers.length || polylines.length || textLabelsV.length);
}
// 선(묶음선 포함)이 좌표 c 에서 tol(지도단위) 안에 있나 — 메르카토르 좌표로 직접 계산
function _polyWithinV(lyr, c, tol) {
  for (const cs of coordParts(lyr)) {
    if (!cs || cs.length < 2) continue;
    for (let i = 0; i < cs.length - 1; i++) {
      if (ptSegDist(c, cs[i], cs[i + 1]) <= tol) return true;
    }
  }
  return false;
}

function eraseAtCoord(coord) {
  if (!coord) return;
  let res = 0;
  try { res = vmap.getView().getResolution(); } catch (e) {}
  if (!(res > 0)) return;
  const tol = res * ERASE_TOL_PX;   // 화면 픽셀 반경 → 지도 좌표 반경

  const batch = [];
  for (const m of markers) {
    const c = m.feat.getGeometry().getCoordinates();
    if (Math.hypot(c[0] - coord[0], c[1] - coord[1]) <= tol) batch.push({ kind: 'marker', obj: m });
  }
  for (const t of textLabelsV) {
    if (Math.hypot(t.coord[0] - coord[0], t.coord[1] - coord[1]) <= tol) batch.push({ kind: 'text', obj: t });
  }
  for (const lyr of polylines) {
    if (_polyWithinV(lyr, coord, tol)) batch.push({ kind: 'line', obj: lyr });
  }

  if (!batch.length) { showToastMsg('지울 객체가 없습니다'); return; }
  closeAllPopups();
  batch.forEach(_removeErasedV);
  pushEraseBatch(batch);
  _syncSaveBtnV();
  showToastMsg(batch.length + '개 삭제 — ↩️ 로 되돌릴 수 있어요');
  autoSaveToDB();
}

function setEraseMode(on) {
  eraseMode = !!on;
  document.getElementById('eraseBtn').classList.toggle('active', eraseMode);
  if (eraseMode) {
    if (drawing) endDraw();
    if (markerPlacingMode) {
      markerPlacingMode = false;
      document.getElementById('markerBtn').classList.remove('active');
      document.getElementById('crosshair').classList.remove('show');
    }
    closeAllPopups();
    showToastMsg('지우개: 지울 곳을 탭하세요 (다시 누르면 해제)');
  } else {
    eraseHistory = [];   // 모드를 끝내면 되돌리기 이력도 비운다 (버튼도 같이 사라짐)
  }
  updateUndoBtn();
}

document.getElementById('eraseBtn').onclick = () => setEraseMode(!eraseMode);

document.getElementById('undoBtn').onclick = () => {
  const batch = eraseHistory.pop();
  if (!batch) { updateUndoBtn(); return; }
  batch.forEach(_restoreErasedV);
  _syncSaveBtnV();
  updateUndoBtn();
  showToastMsg(batch.length + '개 되살림');
  autoSaveToDB();
};

/* ── 화면 초기화 버튼 (빗자루 = 전체 삭제) ──
   되돌리기 대상이 아니다 — 확인창으로 한 번 막고, 이력도 남기지 않는다. */
document.getElementById('clearBtn').onclick = () => {
  if (!confirm('모든 마커와 선을 삭제하고 화면을 초기화할까요?')) return;
  closeAllPopups();
  markers.forEach(m => removeLyr(m.lyr)); markers = [];
  polylines.forEach(l => removeLyr(l)); polylines = [];
  clearTextLabelsV();
  clearOrigs();   // 보관 원본 전체 정리
  if (drawing) endDraw();
  if (eraseMode) setEraseMode(false);   // 이력도 함께 비워짐
  eraseHistory = [];
  updateUndoBtn();
  document.getElementById('saveBtn').disabled = true;
  autoSaveToDB();
};


// ─── 워커 압축 (OffscreenCanvas) ─────────────────────
// 사진 압축을 Web Worker 에서 수행 — 페이지 캔버스로 압축하면 파일 선택창을
// 다녀온 직후 지도 타일이 하얗게 죽는 기기가 있음 (압축 자체가 백화 원인).
// 워커는 페이지 렌더링/GPU 와 분리되어 지도에 영향을 주지 않는다.
const _imgWorkerCode = "self.onmessage=async e=>{const{id,file,max,target}=e.data;try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});let w=bmp.width,h=bmp.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const cv=new OffscreenCanvas(w,h);cv.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();let q=0.85,blob=await cv.convertToBlob({type:'image/jpeg',quality:q});while(blob.size>target&&q>0.1){q=Math.round((q-0.05)*100)/100;blob=await cv.convertToBlob({type:'image/jpeg',quality:q});}const buf=await blob.arrayBuffer();self.postMessage({id,ok:true,buf},[buf]);}catch(err){self.postMessage({id,ok:false});}};";
let _imgWorker = null;
const _imgJobs = new Map();
let _imgJobId = 0;
function _getImgWorker() {
  if (_imgWorker !== null) return _imgWorker;
  try {
    if (typeof OffscreenCanvas === 'undefined' || typeof createImageBitmap === 'undefined' || typeof Worker === 'undefined') { _imgWorker = false; return false; }
    _imgWorker = new Worker(URL.createObjectURL(new Blob([_imgWorkerCode], { type: 'text/javascript' })));
    _imgWorker.onmessage = e => { const j = _imgJobs.get(e.data.id); if (j) { _imgJobs.delete(e.data.id); j(e.data); } };
    _imgWorker.onerror = () => { _imgJobs.forEach(j => j({ ok: false })); _imgJobs.clear(); };
  } catch(e) { _imgWorker = false; }
  return _imgWorker;
}
// 파일을 워커에서 압축해 JPEG dataURL 로 반환. 실패/미지원이면 null (호출측이 원본 사용).
function compressFileInWorker(file) {
  return new Promise(resolve => {
    const w = _getImgWorker();
    if (!w) return resolve(null);
    const id = ++_imgJobId;
    const to = setTimeout(() => { _imgJobs.delete(id); resolve(null); }, 20000);
    _imgJobs.set(id, d => {
      clearTimeout(to);
      if (!d.ok || !d.buf) return resolve(null);
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(new Blob([d.buf], { type: 'image/jpeg' }));
    });
    try { w.postMessage({ id, file, max: 1920, target: COMPRESS_TARGET }); }
    catch(e) { clearTimeout(to); _imgJobs.delete(id); resolve(null); }
  });
}

/* ════════════════════════════════
   이미지 압축 / GPS 다운로드
════════════════════════════════ */
const _compressCache = new Map();   // 원본 src → 압축 결과 (같은 사진 매번 재압축 방지)
const COMPRESS_TARGET = 300 * 1024;
// JPEG 인코딩을 toBlob(비동기)으로 — toDataURL 은 메인 스레드를 수백 ms 씩 막아
// 사진 불러올 때 지도가 하얗게 멈추는 원인이었음. 실패 시 toDataURL 폴백.
function _canvasJpeg(cv, q) {
  return new Promise(res => {
    if (!cv.toBlob) return res(cv.toDataURL('image/jpeg', q));
    cv.toBlob(b => {
      if (!b) return res(cv.toDataURL('image/jpeg', q));
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(cv.toDataURL('image/jpeg', q));
      fr.readAsDataURL(b);
    }, 'image/jpeg', q);
  });
}
function compressImage(src) {
  if (_compressCache.has(src)) return Promise.resolve(_compressCache.get(src));
  // 이미 목표 크기 이하인 JPEG(불러올 때 만든 표시본 등)은 재압축 생략 — 자동저장 때마다
  // 전체 사진을 다시 canvas 인코딩하느라 지도가 멈추던 문제 방지
  if (/^data:image\/jpe?g/i.test(src) && src.length * 0.75 <= COMPRESS_TARGET * 1.2) {
    return Promise.resolve(src);
  }
  return new Promise(res => {
    const TARGET = COMPRESS_TARGET;
    const img = new Image();
    // 디코딩 실패(HEIC 등 미지원 포맷) 시 onload 가 영영 안 와서 불러오기/자동저장이
    // 통째로 멈추던 문제 — 원본 그대로 반환하고 계속 진행
    img.onerror = () => res(src);
    img.onload = async () => {
      const M = 1920; let w = img.width, h = img.height;
      if (w > M || h > M) { if (w > h) { h = Math.round(h*M/w); w = M; } else { w = Math.round(w*M/h); h = M; } }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.85, r = await _canvasJpeg(cv, q);
      while (r.length * 0.75 > TARGET && q > 0.1) { q = Math.round((q - 0.05)*100)/100; r = await _canvasJpeg(cv, q); }
      // 원본 EXIF 복원 — canvas 는 GPS·촬영일시 등 EXIF 를 모두 버리므로 다시 삽입 (index.html 과 동일)
      try {
        const exif = piexif.load(src);
        if (exif['0th']) { delete exif['0th'][piexif.ImageIFD.UserComment]; delete exif['0th'][piexif.ImageIFD.ImageDescription]; }
        if (exif['Exif']) delete exif['Exif'][piexif.ExifIFD.UserComment];
        r = _exifSafeCarry(exif, r);
      } catch(e) {}
      cv.width = cv.height = 0;   // 캔버스 메모리 즉시 해제
      _compressCache.set(src, r);
      res(r);
    };
    img.src = src;
  });
}


/* ════════════════════════════════
   EXIF 메타 유틸 (piexif) — index.html 과 동일
════════════════════════════════ */

// piexif.dump() 출력의 TIFF 사양 위반을 표준 구조로 재조립:
//  - IFD 엔트리 태그 오름차순 정렬 (piexif 는 Exif/GPS 포인터를 맨 뒤에 붙여 미정렬 —
//    안드로이드 등 엄격한 파서는 정렬을 가정해 GPS 포인터를 못 찾을 수 있음)
//  - 모든 IFD 뒤에 next-IFD 오프셋 기록 (piexif 는 서브 IFD 종결자 누락 → 뒤 4바이트가
//    쓰레기 오프셋으로 읽혀 체인 파서가 EXIF 전체를 버림) — 폰 갤러리 위치 미인식의 원인
// 실패 시 원본 그대로 반환 (안전).
function _fixExif(exifStr) {
  try {
    if (exifStr.slice(0, 6) !== 'Exif\x00\x00') return exifStr;
    const t = exifStr.slice(6);
    const le = t.slice(0, 2) === 'II';
    if (!le && t.slice(0, 2) !== 'MM') return exifStr;
    const b = o => t.charCodeAt(o) & 0xFF;
    const u16 = o => le ? b(o) | (b(o+1) << 8) : (b(o) << 8) | b(o+1);
    const u32 = o => le ? (u16(o) | (u16(o+2) * 0x10000)) : (u16(o) * 0x10000 + u16(o+2));
    const SZ = { 1:1, 2:1, 3:2, 4:4, 5:8, 6:1, 7:1, 8:2, 9:4, 10:8, 11:4, 12:8 };
    const valU32 = s => { const c = i => s.charCodeAt(i) & 0xFF; return le ? c(0) + c(1)*0x100 + c(2)*0x10000 + c(3)*0x1000000 : c(0)*0x1000000 + c(1)*0x10000 + c(2)*0x100 + c(3); };

    function readIFD(off) {
      if (off <= 0 || off + 2 > t.length) return null;
      const n = u16(off), entries = [];
      if (off + 2 + 12*n > t.length) return null;
      for (let k = 0; k < n; k++) {
        const p = off + 2 + 12*k, tag = u16(p), typ = u16(p+2), cnt = u32(p+4);
        if (!SZ[typ]) continue;
        const size = SZ[typ] * cnt;
        let val;
        if (size <= 4) val = t.slice(p+8, p+12);
        else { const vo = u32(p+8); if (vo + size > t.length) continue; val = t.slice(vo, vo + size); }
        entries.push({ tag, typ, cnt, val });
      }
      const nx = off + 2 + 12*n + 4 <= t.length ? u32(off + 2 + 12*n) : 0;
      return { entries, next: nx };
    }
    const take = (list, tag) => { const i = list.findIndex(e => e.tag === tag); return i < 0 ? null : list.splice(i, 1)[0]; };

    const ifd0 = readIFD(u32(4));
    if (!ifd0) return exifStr;
    const pExif = take(ifd0.entries, 0x8769), pGPS = take(ifd0.entries, 0x8825);
    const exifIFD = pExif ? readIFD(valU32(pExif.val)) : null;
    let interopIFD = null;
    if (exifIFD) { const pI = take(exifIFD.entries, 0xA005); interopIFD = pI ? readIFD(valU32(pI.val)) : null; }
    const gpsIFD = pGPS ? readIFD(valU32(pGPS.val)) : null;
    let ifd1 = ifd0.next ? readIFD(ifd0.next) : null, thumb = '';
    if (ifd1) {
      const pT = take(ifd1.entries, 0x0201), pL = take(ifd1.entries, 0x0202);
      if (pT && pL) {
        const to = valU32(pT.val), tl = valU32(pL.val);
        if (to + tl <= t.length) thumb = t.slice(to, to + tl);
      }
      if (!thumb) ifd1 = null;   // 썸네일 없는 IFD1 은 버림
    }

    // ── 재조립 ──
    const chr = String.fromCharCode;
    const p16 = v => le ? chr(v & 255) + chr((v >> 8) & 255) : chr((v >> 8) & 255) + chr(v & 255);
    const p32 = v => le ? p16(v & 0xFFFF) + p16((v / 0x10000) & 0xFFFF) : p16((v / 0x10000) & 0xFFFF) + p16(v & 0xFFFF);
    function prep(ifd) {   // 정렬 + 중복 제거 + 크기 계산
      const seen = {};
      ifd.entries = ifd.entries.filter(e => seen[e.tag] ? false : (seen[e.tag] = 1)).sort((a, b) => a.tag - b.tag);
      ifd.valSize = ifd.entries.reduce((s, e) => s + (e.val.length > 4 ? e.val.length + (e.val.length & 1) : 0), 0);
      ifd.tblSize = 2 + 12 * ifd.entries.length + 4;
      return ifd;
    }
    function serIFD(ifd, tblOff, next) {
      let vo = tblOff + ifd.tblSize, tbl = p16(ifd.entries.length), vals = '';
      for (const e of ifd.entries) {
        tbl += p16(e.tag) + p16(e.typ) + p32(e.cnt);
        if (e.val.length <= 4) tbl += (e.val + '\x00\x00\x00\x00').slice(0, 4);
        else { tbl += p32(vo); vals += e.val + (e.val.length & 1 ? '\x00' : ''); vo += e.val.length + (e.val.length & 1); }
      }
      return tbl + p32(next) + vals;
    }

    const mkPtr = tag => ({ tag, typ: 4, cnt: 1, val: '\x00\x00\x00\x00' });
    if (exifIFD) ifd0.entries.push(mkPtr(0x8769));
    if (gpsIFD) ifd0.entries.push(mkPtr(0x8825));
    if (exifIFD && interopIFD) exifIFD.entries.push(mkPtr(0xA005));
    if (ifd1) { ifd1.entries.push(mkPtr(0x0201)); ifd1.entries.push({ tag: 0x0202, typ: 4, cnt: 1, val: p32(thumb.length) }); }

    [ifd0, exifIFD, interopIFD, gpsIFD, ifd1].forEach(f => f && prep(f));

    // 순차 배치: IFD0 → Exif → Interop → GPS → IFD1 → 썸네일
    let cur = 8 + ifd0.tblSize + ifd0.valSize;
    const at = {};
    if (exifIFD) { at.exif = cur; cur += exifIFD.tblSize + exifIFD.valSize; }
    if (interopIFD) { at.interop = cur; cur += interopIFD.tblSize + interopIFD.valSize; }
    if (gpsIFD) { at.gps = cur; cur += gpsIFD.tblSize + gpsIFD.valSize; }
    if (ifd1) { at.ifd1 = cur; cur += ifd1.tblSize + ifd1.valSize; at.thumb = cur; }

    const setPtr = (ifd, tag, v) => { const e = ifd.entries.find(x => x.tag === tag); if (e) e.val = p32(v); };
    setPtr(ifd0, 0x8769, at.exif || 0); setPtr(ifd0, 0x8825, at.gps || 0);
    if (exifIFD) setPtr(exifIFD, 0xA005, at.interop || 0);
    if (ifd1) setPtr(ifd1, 0x0201, at.thumb || 0);

    let out = (le ? 'II' : 'MM') + p16(42) + p32(8);
    out += serIFD(ifd0, 8, at.ifd1 || 0);
    if (exifIFD) out += serIFD(exifIFD, at.exif, 0);
    if (interopIFD) out += serIFD(interopIFD, at.interop, 0);
    if (gpsIFD) out += serIFD(gpsIFD, at.gps, 0);
    if (ifd1) out += serIFD(ifd1, at.ifd1, 0) + thumb;
    return 'Exif\x00\x00' + out;
  } catch (e) { console.warn('EXIF 정규화 실패', e); return exifStr; }
}

// EXIF 를 통째로 재직렬화(dump)하다 실패하면(일부 폰 MakerNote 등)
// 핵심 필드(날짜·GPS·제목·설명)만이라도 옮겨서 기록한다 — 실패 시 메타가 통째로 사라지던 문제 방지.
function _exifSafeCarry(exif, jpegDataUrl) {
  try { return piexif.insert(_fixExif(piexif.dump(exif)), jpegDataUrl); }
  catch(e) {
    try {
      const fresh = { '0th':{}, 'Exif':{}, 'GPS':{}, '1st':{}, 'thumbnail':null };
      const o = exif['0th'] || {}, x = exif['Exif'] || {}, g = exif['GPS'] || {};
      const dt = x[piexif.ExifIFD.DateTimeOriginal] || o[piexif.ImageIFD.DateTime];
      if (dt) { fresh['Exif'][piexif.ExifIFD.DateTimeOriginal] = dt; fresh['0th'][piexif.ImageIFD.DateTime] = dt; }
      if (g[piexif.GPSIFD.GPSLatitude]) {
        fresh['GPS'][piexif.GPSIFD.GPSVersionID]    = g[piexif.GPSIFD.GPSVersionID]    || [2, 3, 0, 0];
        fresh['GPS'][piexif.GPSIFD.GPSLatitudeRef]  = g[piexif.GPSIFD.GPSLatitudeRef]  || 'N';
        fresh['GPS'][piexif.GPSIFD.GPSLatitude]     = g[piexif.GPSIFD.GPSLatitude];
        fresh['GPS'][piexif.GPSIFD.GPSLongitudeRef] = g[piexif.GPSIFD.GPSLongitudeRef] || 'E';
        fresh['GPS'][piexif.GPSIFD.GPSLongitude]    = g[piexif.GPSIFD.GPSLongitude];
      }
      if (o[piexif.ImageIFD.XPTitle])   fresh['0th'][piexif.ImageIFD.XPTitle]   = o[piexif.ImageIFD.XPTitle];
      if (o[piexif.ImageIFD.XPComment]) fresh['0th'][piexif.ImageIFD.XPComment] = o[piexif.ImageIFD.XPComment];
      if (o[piexif.ImageIFD.ImageDescription]) fresh['0th'][piexif.ImageIFD.ImageDescription] = o[piexif.ImageIFD.ImageDescription];
      return piexif.insert(_fixExif(piexif.dump(fresh)), jpegDataUrl);
    } catch(e2) { console.warn('EXIF 기록 실패', e2); return jpegDataUrl; }
  }
}

// XPTitle/XPComment 는 UTF-16LE 바이트 배열 (한글 안전 — 탐색기/데스크톱 뷰어와 동일 필드)
function _xpBytes(str) { const a = []; for (const ch of String(str)) { const c = ch.charCodeAt(0); a.push(c & 0xFF, (c >> 8) & 0xFF); } a.push(0, 0); return a; }
function _xpStr(bytes) { if (!bytes || !bytes.length) return ''; let s = ''; for (let i = 0; i + 1 < bytes.length; i += 2) { const c = bytes[i] | (bytes[i+1] << 8); if (!c) break; s += String.fromCharCode(c); } return s; }
function _gpsRat(v) { v = Math.abs(v); const d = Math.floor(v), mF = (v - d) * 60, m = Math.floor(mF), s = Math.round((mF - m) * 60 * 10000); return [[d,1],[m,1],[s,10000]]; }
function exifNow(d = new Date()) { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}:${p(d.getMonth()+1)}:${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
// 사진 dataURL 에서 제목/설명/촬영일시/GPS 읽기
function readPhotoMeta(imgSrc) {
  const out = { title:'', desc:'', taken:'', lat:null, lng:null };
  try {
    const ex = piexif.load(imgSrc);
    out.title = _xpStr(ex['0th'][piexif.ImageIFD.XPTitle]);
    out.desc  = _xpStr(ex['0th'][piexif.ImageIFD.XPComment]);
    out.taken = (ex['Exif'] && ex['Exif'][piexif.ExifIFD.DateTimeOriginal]) || ex['0th'][piexif.ImageIFD.DateTime] || '';
    const gps = ex['GPS'];
    if (gps && gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
      const toDec = (dms, ref) => { const d = dms[0][0]/dms[0][1], m = dms[1][0]/dms[1][1], s = dms[2][0]/dms[2][1]; return (d + m/60 + s/3600) * ((ref === 'S' || ref === 'W') ? -1 : 1); };
      const la = toDec(gps[piexif.GPSIFD.GPSLatitude],  gps[piexif.GPSIFD.GPSLatitudeRef]  || 'N');
      const lo = toDec(gps[piexif.GPSIFD.GPSLongitude], gps[piexif.GPSIFD.GPSLongitudeRef] || 'E');
      if (!isNaN(la) && !isNaN(lo) && (la !== 0 || lo !== 0)) { out.lat = la; out.lng = lo; }
    }
  } catch(e) {}
  return out;
}

// ─── EXIF 읽기 폴백 (exifr) — index.html 과 동일 ─────
// piexif 는 JPEG 의 APP1 을 자체 파서로 훑기 때문에, 아래 경우 GPS 를 통째로 놓친다.
// 다른 사진앱들은 잘 읽는데 이 뷰어만 못 읽던 원인:
//   · 삼성/아이폰의 큰 MakerNote·다중 APP1 → piexif.load 가 예외 → catch(e){} 로 조용히 삼켜짐
//   · HEIC/HEIF (아이폰 기본), PNG, WebP → piexif 는 JPEG 전용이라 아예 못 읽음
//   · 위치가 EXIF 가 아니라 XMP 에 들어 있는 사진
// exifr 은 원본 File/Blob 을 청크 단위로 직접 읽어 위 경우를 모두 처리한다.
// (스크립트는 예전부터 로드돼 있었지만 실제로 호출하는 곳이 없었다 — 2026-08-11 연결)
async function readPhotoMetaFallback(file) {
  const out = { taken:'', lat:null, lng:null };
  if (!window.exifr || !file) return out;
  try {
    let ex = null;
    try { ex = await exifr.parse(file, { tiff:true, ifd0:true, exif:true, gps:true, xmp:true }); } catch(e) {}
    let la = ex && ex.latitude, lo = ex && ex.longitude;
    if (la == null || lo == null) {                       // gps() 는 더 관대한 경로 — 한 번 더 시도
      try { const g = await exifr.gps(file); if (g) { la = g.latitude; lo = g.longitude; } } catch(e) {}
    }
    if (typeof la === 'number' && typeof lo === 'number' &&
        !isNaN(la) && !isNaN(lo) && (la !== 0 || lo !== 0)) { out.lat = la; out.lng = lo; }
    const d = ex && (ex.DateTimeOriginal || ex.CreateDate || ex.ModifyDate);
    if (d instanceof Date && !isNaN(d)) out.taken = exifNow(d);
    else if (typeof d === 'string') out.taken = d;
  } catch(e) { console.warn('exifr 폴백 실패', e); }
  return out;
}

// GPS/촬영일시 등을 JPEG dataURL 의 EXIF 에 기록 (전달 안 한 항목은 유지)
function writePhotoMeta(imgSrc, { title, desc, lat, lng, taken } = {}) {
  try {
    let ex; try { ex = piexif.load(imgSrc); } catch(e) { ex = { '0th':{}, 'Exif':{}, 'GPS':{}, '1st':{}, 'thumbnail':null }; }
    ex['0th'] = ex['0th'] || {}; ex['Exif'] = ex['Exif'] || {}; ex['GPS'] = ex['GPS'] || {};
    if (title != null) {
      ex['0th'][piexif.ImageIFD.XPTitle] = _xpBytes(title);
      // ImageDescription 은 ASCII 필드 — 한글이면 기록 안 함 (외부 뷰어 인코딩 깨짐 방지)
      if (/^[\x00-\x7F]*$/.test(title)) ex['0th'][piexif.ImageIFD.ImageDescription] = title;
      else delete ex['0th'][piexif.ImageIFD.ImageDescription];
    }
    if (desc != null) ex['0th'][piexif.ImageIFD.XPComment] = _xpBytes(desc);
    if (taken) { ex['Exif'][piexif.ExifIFD.DateTimeOriginal] = taken; ex['0th'][piexif.ImageIFD.DateTime] = taken; }
    // 카메라 파일과 유사하게 기본 태그 보강 (없을 때만)
    ex['0th'][piexif.ImageIFD.Orientation] = ex['0th'][piexif.ImageIFD.Orientation] || 1;
    ex['Exif'][piexif.ExifIFD.ExifVersion] = ex['Exif'][piexif.ExifIFD.ExifVersion] || '0231';
    if (lat != null && lng != null) {
      // 카메라 앱과 동일한 GPS 블록 구성 (VersionID·고도·날짜/시간스탬프 포함)
      ex['GPS'][piexif.GPSIFD.GPSVersionID]    = ex['GPS'][piexif.GPSIFD.GPSVersionID] || [2, 3, 0, 0];
      ex['GPS'][piexif.GPSIFD.GPSLatitudeRef]  = lat >= 0 ? 'N' : 'S';
      ex['GPS'][piexif.GPSIFD.GPSLatitude]     = _gpsRat(lat);
      ex['GPS'][piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
      ex['GPS'][piexif.GPSIFD.GPSLongitude]    = _gpsRat(lng);
      ex['GPS'][piexif.GPSIFD.GPSAltitudeRef]  = ex['GPS'][piexif.GPSIFD.GPSAltitudeRef] || 0;
      ex['GPS'][piexif.GPSIFD.GPSAltitude]     = ex['GPS'][piexif.GPSIFD.GPSAltitude] || [0, 1];
      const _ts = taken || ex['Exif'][piexif.ExifIFD.DateTimeOriginal] || exifNow();
      const _md = String(_ts).match(/^(\d{4}:\d{2}:\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if (_md && !ex['GPS'][piexif.GPSIFD.GPSDateStamp]) {
        ex['GPS'][piexif.GPSIFD.GPSDateStamp] = _md[1];
        ex['GPS'][piexif.GPSIFD.GPSTimeStamp] = [[+_md[2], 1], [+_md[3], 1], [+_md[4], 1]];
      }
    }
    return _exifSafeCarry(ex, imgSrc);
  } catch(e) { console.warn('EXIF 기록 실패', e); return imgSrc; }
}
// JFIF(APP0) 세그먼트 제거 — 카메라 파일과 동일한 'SOI + APP1' 구조로 정리
function _stripApp0(u8) {
  try {
    if (u8[0] !== 0xFF || u8[1] !== 0xD8) return u8;
    let i = 2, app0 = null, hasExif = false;
    while (i + 3 < u8.length && u8[i] === 0xFF) {
      const m = u8[i + 1];
      if (m === 0xDA) break;
      const len = (u8[i + 2] << 8) | u8[i + 3];
      if (m === 0xE0) app0 = [i, i + 2 + len];
      if (m === 0xE1 && u8[i + 4] === 0x45 && u8[i + 5] === 0x78) hasExif = true;   // 'Ex'if
      i += 2 + len;
    }
    if (app0 && hasExif) {
      const o = new Uint8Array(u8.length - (app0[1] - app0[0]));
      o.set(u8.subarray(0, app0[0]), 0);
      o.set(u8.subarray(app0[1]), app0[0]);
      return o;
    }
  } catch(e) {}
  return u8;
}
// 사진을 기기에 저장 (안드로이드: 다운로드 폴더 → 갤러리에 표시됨)
// data: URL 은 용량이 크면 안드로이드 크롬에서 다운로드가 '조용히' 실패 → Blob 으로 변환해 저장.
// 바이트 변환은 fetch(dataURL) 네이티브 경로 사용 — 수백만 회 charCodeAt 루프가
// 메인 스레드를 1~2초 막아 지도가 하얗게 멈추던 원인이었음.
async function downloadPhoto(imgSrc, name) {
  const nm0 = (name || 'photo').replace(/[\\/:*?"<>|]/g, '_');
  const nm = /\.jpe?g$/i.test(nm0) ? nm0 : nm0 + '.jpg';
  let href = imgSrc, revoke = null;
  try {
    const blob = await (await fetch(imgSrc)).blob();
    const mime = blob.type || 'image/jpeg';
    let u8 = new Uint8Array(await blob.arrayBuffer());
    if (/jpe?g$/i.test(mime)) u8 = _stripApp0(u8);
    href = URL.createObjectURL(new Blob([u8], { type: mime }));
    revoke = href;
  } catch(e) {}
  const a = document.createElement('a');
  a.href = href; a.download = nm;
  document.body.appendChild(a); a.click(); a.remove();
  if (revoke) setTimeout(() => URL.revokeObjectURL(revoke), 10000);
}
// 사진 메타(설명/촬영일시) → ExtendedData 조각 (자동저장/내보내기 → 재로드 복원용)
function _photoMetaXmlV(m) {
  let s = '';
  if (m.desc) s += `<Data name="desc"><value>${esc(m.desc)}</value></Data>`;
  if (m.taken) s += `<Data name="taken"><value>${esc(m.taken)}</value></Data>`;
  if (m.origKey) s += `<Data name="orig"><value>${esc(m.origKey)}</value></Data>`;   // 원본 보관소 키
  return s;
}
/* ════════════════════════════════
   fitPts / dlBlob
════════════════════════════════ */
function fitPts(pts) {
  if (!pts || !pts.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(c => { if(c[0]<minX)minX=c[0];if(c[0]>maxX)maxX=c[0];if(c[1]<minY)minY=c[1];if(c[1]>maxY)maxY=c[1]; });
  vmap.getView().setCenter([(minX+maxX)/2,(minY+maxY)/2]);
  const w=maxX-minX,h=maxY-minY;
  if (w<100&&h<100) { vmap.getView().setZoom(16); return; }
  const mapSize=vmap.getSize()||[innerWidth,innerHeight];
  const res=Math.max(w/Math.max(mapSize[0]-160,100),h/Math.max(mapSize[1]-160,100));
  vmap.getView().setZoom(Math.min(Math.max(Math.floor(Math.log2(156543.03392/res)),1),16));
}

/* ════════════════════════════════
   나침반 / 회전 잠금 (2-state)
   1번째 클릭: 북방향으로 고정
   2번째 클릭: 잠금 해제
   ※ change:rotation 리스너(initMap 내)가 rotationLocked 시 rotation을 0으로 강제
════════════════════════════════ */
let rotationLocked = false;

/* 회전 인터랙션 활성/비활성 헬퍼 */
function setRotationInteractions(enabled) {
  if (!vmap) return;
  vmap.getInteractions().forEach(i => {
    // PinchRotate, DragRotate, DragRotateAndZoom 모두 처리
    const name = i.constructor && i.constructor.name ? i.constructor.name : '';
    if (name.indexOf('Rotate') !== -1 ||
        (typeof ol.interaction.PinchRotate !== 'undefined' && i instanceof ol.interaction.PinchRotate) ||
        (typeof ol.interaction.DragRotate  !== 'undefined' && i instanceof ol.interaction.DragRotate)) {
      i.setActive(enabled);
    }
  });
}

document.getElementById('compassBtn').onclick = () => {
  if (!vmap) return;
  const view = vmap.getView();
  if (rotationLocked) {
    // ── 잠금 해제 ──
    rotationLocked = false;
    setRotationInteractions(true);  // 회전 인터랙션 복원
    document.getElementById('compassBtn').classList.remove('locked');
    document.getElementById('compassBtn').title = '북방향 고정';
  } else {
    // ── 잠금: flag 먼저 설정 → 북방향 복귀 → 인터랙션 비활성 ──
    rotationLocked = true;
    view.setRotation(0);            // 즉시 북방향 (animate 불안정)
    setRotationInteractions(false); // 핀치/드래그 회전 차단
    document.getElementById('compassBtn').classList.add('locked');
    document.getElementById('compassBtn').title = '회전 잠금 중 (한 번 더 누르면 해제)';
  }
};

/* ════════════════════════════════
   지도 종류 변경 (VWorld)
════════════════════════════════ */
function changeVWorldMapType(value) {
  if (!vmap) return;
  try { vmap.setBasemapType(vw.ol3.BasemapType[value]); } catch(e) { console.warn('지도 유형 변경 오류', e); }
  if (value === 'PHOTO') prunePhotoBaseLayers();
}

// 항공사진 모드일 때 함께 깔리는 일반지도/하이브리드 베이스 타일을 끈다 (불필요한 타일 요청 제거 → 가벼움).
// VWorld 베이스 타일 URL의 종류명만 보고 판단. 위성(Satellite)만 남기고 Base/Hybrid/gray류는 숨김.
// 마커/선(벡터)·지적도(/req/wms)는 건드리지 않음. 실패해도 지도에 영향 없도록 방어적 처리.
function prunePhotoBaseLayers() {
  if (!vmap) return;
  try {
    vmap.getLayers().getArray().forEach(layer => {
      if (!(layer instanceof ol.layer.Tile)) return;
      const src = layer.getSource && layer.getSource();
      if (!src) return;
      let urls = [];
      try { if (src.getUrls) urls = src.getUrls() || []; else if (src.getUrl) urls = [src.getUrl()].filter(Boolean); } catch(_) {}
      const u = urls.join(' ').toLowerCase();
      if (!u) return;
      if (u.indexOf('/req/wms') !== -1) return;            // 지적도(WMS) 제외
      if (/\/(satellite|photo)\//.test(u)) return;          // 항공사진 레이어는 유지
      if (/\/(base|hybrid|gray|grey|midnight)\//.test(u)) { // 일반/하이브리드/회색 베이스만 숨김
        layer.setVisible(false);
      }
    });
  } catch(e) { console.warn('베이스 레이어 정리 건너뜀', e); }
}

/* ════════════════════════════════
   연도별 항공사진 (국토지리정보원 국토정보플랫폼) — Vmap.html 과 동일 구현
   ─ 브이월드 공개 WMTS 에는 과거 영상이 없어서(Satellite 최신본뿐) 국토정보맵이 쓰는
     연도별 항공사진 WMTS 를 배경지도 위에 얹는다.
       연도 목록 : POST https://map.ngii.go.kr/openapi/AirPhotoYearList.do
       타 일     : https://map.ngii.go.kr/airmapprime/map/wmts
                   LAYER=mapprime:air_<연도>, TILEMATRIXSET=NGIS_AIR (EPSG:5179/UTM-K)
   ─ 브이월드 번들(OL 3.10)에는 proj4 가 없어 EPSG:5179(TM, GRS80) 변환식을 직접 등록한다.
     지도 뷰 좌표계 코드가 'EPSG:900913' 이라 3857 만 등록하면 변환을 못 찾아
     타일을 아예 요청하지 않는다 → 등가 코드를 전부 등록.
════════════════════════════════ */
const NGII_AIR_URL  = 'https://map.ngii.go.kr/airmapprime/map/wmts';
// NGIS_AIR 매트릭스셋 해상도(m/px) — 국토정보맵 wmts_ngiiMap 스크립트와 동일
const NGII_AIR_RES  = [66846.72,33423.36,16711.68,8355.84,4177.92,2088.96,1044.48,522.24,
                       261.12,130.56,65.28,32.64,16.32,8.16,4.08,2.04,1.02,0.51,0.255,0.1275,0.06375];
const NGII_AIR_ORIG = [-200000, 4000000];
// 목록 API 가 막히면 쓰는 기본값 (2011년부터 매년 제공)
const NGII_AIR_YEARS_FALLBACK = [2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011];
let airYearLayer = null, airCoverLayer = null;

// EPSG:5179 등록 (proj4 없이 — TM 정/역투영 급수식 직접 구현)
(function registerEPSG5179() {
  const A = 6378137, F = 1 / 298.257222101, E2 = F * (2 - F), EP2 = E2 / (1 - E2),
        K0 = 0.9996, LAT0 = 38 * Math.PI / 180, LON0 = 127.5 * Math.PI / 180,
        X0 = 1000000, Y0 = 2000000, D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const M = p => A * ((1 - E2/4 - 3*E2*E2/64 - 5*E2*E2*E2/256) * p
                    - (3*E2/8 + 3*E2*E2/32 + 45*E2*E2*E2/1024) * Math.sin(2*p)
                    + (15*E2*E2/256 + 45*E2*E2*E2/1024) * Math.sin(4*p)
                    - (35*E2*E2*E2/3072) * Math.sin(6*p));
  const M0 = M(LAT0);
  function fwd(c) {   // [경도,위도](도) -> [x,y](m)
    const phi = c[1] * D2R, lam = c[0] * D2R;
    const s = Math.sin(phi), co = Math.cos(phi), t = Math.tan(phi);
    const N = A / Math.sqrt(1 - E2 * s * s), T = t * t, C = EP2 * co * co;
    const a1 = (lam - LON0) * co, a2 = a1*a1, a3 = a2*a1, a4 = a2*a2, a5 = a4*a1, a6 = a4*a2;
    return [
      K0 * N * (a1 + (1 - T + C) * a3 / 6
                + (5 - 18*T + T*T + 72*C - 58*EP2) * a5 / 120) + X0,
      K0 * (M(phi) - M0 + N * t * (a2 / 2
                + (5 - T + 9*C + 4*C*C) * a4 / 24
                + (61 - 58*T + T*T + 600*C - 330*EP2) * a6 / 720)) + Y0
    ];
  }
  function inv(c) {   // [x,y](m) -> [경도,위도](도)
    const xx = c[0] - X0, yy = c[1] - Y0;
    const Mv = M0 + yy / K0, se = Math.sqrt(1 - E2), e1 = (1 - se) / (1 + se);
    const mu = Mv / (A * (1 - E2/4 - 3*E2*E2/64 - 5*E2*E2*E2/256));
    const p1 = mu + (3*e1/2 - 27*e1*e1*e1/32) * Math.sin(2*mu)
                  + (21*e1*e1/16 - 55*Math.pow(e1,4)/32) * Math.sin(4*mu)
                  + (151*e1*e1*e1/96) * Math.sin(6*mu)
                  + (1097*Math.pow(e1,4)/512) * Math.sin(8*mu);
    const s = Math.sin(p1), co = Math.cos(p1), t = Math.tan(p1);
    const C1 = EP2 * co * co, T1 = t * t;
    const N1 = A / Math.sqrt(1 - E2 * s * s);
    const R1 = A * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5);
    const D = xx / (N1 * K0), D2 = D*D, D3 = D2*D, D4 = D2*D2, D5 = D4*D, D6 = D4*D2;
    const phi = p1 - (N1 * t / R1) * (D2 / 2
          - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*EP2) * D4 / 24
          + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*EP2 - 3*C1*C1) * D6 / 720);
    const lam = LON0 + (D - (1 + 2*T1 + C1) * D3 / 6
          + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*EP2 + 24*T1*T1) * D5 / 120) / co;
    return [lam * R2D, phi * R2D];
  }
  let has5179 = false;
  try { has5179 = !!ol.proj.get('EPSG:5179'); } catch (e) {}
  if (!has5179) ol.proj.addProjection(new ol.proj.Projection({
    code: 'EPSG:5179', units: 'm', axisOrientation: 'enu',
    extent: [-200000, 1000000, 2000000, 4000000]
  }));
  const GEO  = ['EPSG:4326', 'CRS:84', 'urn:ogc:def:crs:EPSG::4326',
                'urn:ogc:def:crs:OGC:1.3:CRS84', 'http://www.opengis.net/gml/srs/epsg.xml#4326'];
  const MERC = ['EPSG:3857', 'EPSG:900913', 'EPSG:102100', 'EPSG:102113', 'EPSG:3785',
                'urn:ogc:def:crs:EPSG::3857', 'http://www.opengis.net/gml/srs/epsg.xml#3857'];
  GEO.forEach(code => {
    try { if (ol.proj.get(code)) ol.proj.addCoordinateTransforms(code, 'EPSG:5179', fwd, inv); } catch (e) {}
  });
  MERC.forEach(code => {
    try {
      if (!ol.proj.get(code)) return;
      ol.proj.addCoordinateTransforms(code, 'EPSG:5179',
        c => fwd(ol.proj.transform(c, code, 'EPSG:4326')),
        c => ol.proj.transform(inv(c), 'EPSG:4326', code));
    } catch (e) {}
  });
})();

/* 연도별로 제공되는 최대 타일 레벨(2026-08-03 전국 실측):
     2011~2019 -> 17 (0.51 m/px) / 2020~2024 -> 18 (0.255 m/px)
   이보다 확대해서 요청하면 404 가 떠서 '영상 없음' 으로 잘못 판정됐다.
   → 타일격자를 해당 레벨까지만 만들어 두면 OpenLayers 가 가장 깊은 레벨을
     끌어올려(확대해서) 그려준다. 더 확대해도 화면이 비지 않는다.
   ※ 나중에 19레벨이 생겨도 404 는 안 나므로(덜 선명할 뿐) 안전한 기본값이다. */
function ngiiAirMaxLevel(year) { return Number(year) >= 2020 ? 18 : 17; }

function mkAirYearLayer(year) {
  const _res = NGII_AIR_RES.slice(0, ngiiAirMaxLevel(year) + 1);
  let attr;
  try { attr = (typeof ol.Attribution === 'function')
        ? [new ol.Attribution({ html: '항공사진 © 국토지리정보원' })]
        : ['항공사진 © 국토지리정보원']; } catch (e) { attr = undefined; }
  const lyr = new ol.layer.Tile({
    // 브이월드 배경지도가 zIndex 0·1·2 를 쓰므로 그 위, 도형(100+)·지적도 아래
    zIndex: 50,
    source: new ol.source.WMTS({
      url: NGII_AIR_URL, layer: 'mapprime:air_' + year, matrixSet: 'NGIS_AIR',
      format: 'image/jpeg', style: '', projection: 'EPSG:5179',
      wrapX: false, crossOrigin: 'anonymous', attributions: attr,
      tileGrid: new ol.tilegrid.WMTS({
        origin: NGII_AIR_ORIG, resolutions: _res,
        matrixIds: _res.map((_, i) => String(i)), tileSize: [256, 256]
      })
    })
  });
  lyr._ngiiAir = true;
  return lyr;
}

/* 해당 연도 촬영본이 없는 지역이면 타일이 404 라 아무것도 안 그려지는데, 그대로 두면
   밑에 깔린 브이월드 '최신' 영상이 비쳐 보여서 그 해 사진인 줄 오해하게 된다.
   → 연도를 켜는 동안 배경지도를 불투명 판으로 가려 없는 곳은 '빈 화면'으로 보이게 한다. */
function mkAirCoverLayer() {
  let ext;
  try { ext = vmap.getView().getProjection().getExtent(); } catch (e) {}
  if (!ext) ext = [-20037508.34, -20037508.34, 20037508.34, 20037508.34];
  const f = new ol.Feature(new ol.geom.Polygon([[
    [ext[0], ext[1]], [ext[2], ext[1]], [ext[2], ext[3]], [ext[0], ext[3]], [ext[0], ext[1]]
  ]]));
  f.setStyle(new ol.style.Style({ fill: new ol.style.Fill({ color: '#20242b' }) }));
  const lyr = new ol.layer.Vector({ source: new ol.source.Vector({ features: [f] }), zIndex: 49 });
  lyr._ngiiAirCover = true;
  return lyr;
}

/* 현재 화면에 그려질 타일 상태를 직접 훑어 '이 연도 영상이 있는지' 판정.
   로드 이벤트만 세면 캐시된 화면(되돌아오기)에서 이벤트가 안 떠 오판한다.
   OL 타일 상태: 0 IDLE / 1 LOADING / 2 LOADED / 3 ERROR / 4 EMPTY */
function _airScanView() {
  if (!airYearLayer || !vmap) return null;
  try {
    const s = airYearLayer.getSource(), v = vmap.getView(), vp = v.getProjection();
    const tg = s.getTileGridForProjection(vp);
    const z = tg.getZForResolution(v.getResolution());
    const ext = v.calculateExtent(vmap.getSize());
    const c = { ok: 0, bad: 0, pend: 0 };
    tg.forEachTileCoord(ext, z, tc => {
      const t = s.getTile(tc[0], tc[1], tc[2], 1, vp);
      const st = t ? t.getState() : 3;
      if (st === 2) c.ok++; else if (st === 3 || st === 4) c.bad++; else c.pend++;
    });
    return c;
  } catch (e) { return null; }
}

let _airMsgTimer = null;
function _airCheck(delay) {
  clearTimeout(_airMsgTimer);
  _airMsgTimer = setTimeout(() => {
    const el = document.getElementById('airYearMsg');
    if (!el) return;
    if (!airYearLayer) { el.style.display = 'none'; return; }
    const c = _airScanView();
    if (!c) { el.style.display = 'none'; return; }
    if (c.pend > 0) { _airCheck(400); return; }   // 아직 받는 중 — 조금 뒤 다시 판정
    const y = (document.getElementById('airYear') || {}).value || '';
    if (c.bad === 0) { el.style.display = 'none'; return; }
    if (c.ok === 0) { el.className = 'none';    el.textContent = y + '년 항공사진이 이 지역에는 없습니다'; }
    else            { el.className = 'partial'; el.textContent = '빈 곳은 ' + y + '년 촬영본이 없는 구역입니다'; }
    el.style.display = 'block';
  }, delay == null ? 250 : delay);
}

function chgAirYear(v) {
  if (airYearLayer)  { removeLyr(airYearLayer);  airYearLayer = null; }
  if (airCoverLayer) { removeLyr(airCoverLayer); airCoverLayer = null; }
  const el = document.getElementById('airYearMsg');
  if (el) el.style.display = 'none';
  const sel = document.getElementById('airYear');
  if (sel) sel.classList.toggle('on', !!v);
  if (!v || !vmap) return;
  airCoverLayer = mkAirCoverLayer();
  addLyr(airCoverLayer);  // zIndex 49 — 배경지도를 덮음
  airYearLayer = mkAirYearLayer(v);
  addLyr(airYearLayer);   // zIndex 50 — 그 위에 해당 연도 영상
  const s = airYearLayer.getSource();
  s.on('tileloadend',   () => _airCheck());
  s.on('tileloaderror', () => _airCheck());
  _airCheck(600);
}

// 연도 목록 채우기 (실패하면 기본 목록)
function loadAirYears() {
  const sel = document.getElementById('airYear');
  if (!sel) return;
  const fill = ys => ys.forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = String(y).slice(2) + '년';   // 좁은 버튼이라 '15년' 식으로
    o.title = y + '년';
    sel.appendChild(o);
  });
  fetch('https://map.ngii.go.kr/openapi/AirPhotoYearList.do', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'TYPE=STORE&API=WMTS&REQUEST=LIST'
  }).then(r => r.json()).then(j => {
    const ys = (j && j.SUCCESS && Array.isArray(j.RESULT))
      ? j.RESULT.map(o => o.year).filter(Boolean).sort((a, b) => b - a) : [];
    fill(ys.length ? ys : NGII_AIR_YEARS_FALLBACK);
  }).catch(() => fill(NGII_AIR_YEARS_FALLBACK));
}

/* ════════════════════════════════
   단축키
════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (markerPlacingMode) { document.getElementById('markerBtn').click(); return; }
  }
  if (e.altKey) { e.preventDefault(); toggleDraw(); return; }
  if (e.ctrlKey && e.key.toLowerCase()==='s') { e.preventDefault(); exportHTM(); return; }
  if (drawing && (e.key==='Backspace'||(e.ctrlKey&&e.key==='z'))) {
    e.preventDefault();
    if (drawCoords.length > 0) { drawCoords.pop(); refreshDraw(); }
  }
});
